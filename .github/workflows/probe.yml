name: Probe Rivian schema

on:
  workflow_dispatch:
    inputs:
      types:
        description: "GraphQL type names to list fields for (space separated; blank for the defaults)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe (prints field names only)
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          PROBE_TYPES: ${{ inputs.types }}
        run: python -m app.probe $PROBE_TYPES
